substitutions:
  bb8_mac_address: 00:00:00:00:00:00   # Replace with your BB-8's Bluetooth MAC address
  
esphome:
  name: bb8-controller
  friendly_name: BB8 Controller

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable safe mode (required by the button.safe_mode entry below)
safe_mode:

# Enable logging
logger:
  level: "VERBOSE"
  logs:
    # Quiet the ESP32 BLE stack (scan/connect noise) while keeping sphero_bb8 packet
    # dumps at VERBOSE. Per-tag levels may only be quieter than the global level.
    # Tags are the bracketed names in log lines, e.g. [D][sphero_bb8:504] -> sphero_bb8
    esp32_ble: ERROR
    esp32_ble.advertising: ERROR
    esp32_ble_tracker: ERROR
    esp32_ble_client: ERROR
    ble_client: ERROR
    ble_device_base: ERROR

# Enable Bluetooth tracker for finding the BB-8
esp32_ble_tracker:

ble_client:
  - mac_address: ${bb8_mac_address}
    id: bb8_client
    auto_connect: false

external_components:
  - source:
      type: local
      path: components

sphero_bb8:
  id: bb8_hub
  ble_client_id: bb8_client
  auto_connect: false
  restore_lights_on_connect: true   # Re-apply last color after reconnect (default true)

  # Motion scripts, one file per script in scripts/. Comment this line out (or
  # repoint it) to load a different set; script buttons below must match names.
  scripts: !include_dir_merge_list scripts
  
light:
  - platform: sphero_bb8
    id: bb8_main_led
    name: "BB8 Main LED"
    sphero_bb8_id: bb8_hub
    type: RGB

  - platform: sphero_bb8
    id: bb8_tail_led
    name: "BB8 Tail Light"
    sphero_bb8_id: bb8_hub
    type: TAILLIGHT

binary_sensor:
  - platform: sphero_bb8
    name: "BB8 Collision"
    id: bb8_collision

sensor:
  - platform: sphero_bb8
    battery_level:
      name: "BB8 Battery Level"
    battery_voltage:
      name: "BB8 Battery Voltage"
    collision_speed:
      name: "BB8 Collision Speed"
    collision_magnitude:
      name: "BB8 Collision Magnitude"
    
  - platform: uptime
    name: Uptime Sensor
    update_interval: 60s
    entity_category: "diagnostic"

# Dropdown launcher: lists every installed script (from scripts/). Pick one to
# run it; the selection follows every script start, even ones launched from
# buttons or automations.
select:
  - platform: sphero_bb8
    name: "BB8 Script"
    sphero_bb8_id: bb8_hub

# Subset variant: show only some scripts in a dropdown, e.g. the non-favorites
# select:
#   - platform: sphero_bb8
#     name: "BB8 Other Scripts"
#     sphero_bb8_id: bb8_hub
#     scripts:
#       - "Patrol Circle"
#       - "Rainbow Dance"

text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: sphero_bb8
    name: "BB8 Connection Status"
    sphero_bb8_id: bb8_hub
    firmware_version:
      name: "BB8 Firmware Version"
    charging_status:
      name: "BB8 Charging Status"

button:
  # BB8 Controls (favorites as buttons; everything else lives in the
  # "BB8 Script" dropdown above)
  - platform: sphero_bb8
    name: "BB8 Connect"
    sphero_bb8_id: bb8_hub
    type: CONNECT

  - platform: sphero_bb8
    name: "BB8 Disconnect"
    sphero_bb8_id: bb8_hub
    type: DISCONNECT

  - platform: sphero_bb8
    name: "BB8 Center Head"
    sphero_bb8_id: bb8_hub
    type: CENTER_HEAD

  # A favorite as a button; the full list lives in the "BB8 Script" dropdown.
  - platform: "sphero_bb8"
    sphero_bb8_id: bb8_hub
    script_name: "Motor Wiggle"
    name: "Motor Wiggle"


  # Home Assistant Controls
  - platform: restart
    name: "Restart"

  - platform: safe_mode
    name: "Restart (Safe Mode)"

  - platform: shutdown
    name: "Shutdown"



